name: Content Miner

on:
  schedule:
    # Runs daily at 8:00 PM EST (01:00 UTC)
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mine-content:
    name: Mine Latest Podcast & Articles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Content Miner
        run: pnpm run update:content

      - name: Validate build
        run: pnpm run build

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(content): update latest podcast episode and articles'
          branch: chore/automated-content-update
          delete-branch: true
          title: 'chore(content): update latest podcast episode and articles'
          body: |
            ## Automated Content Update

            This PR was automatically generated by the Content Miner pipeline.

            - Synced latest episode for **Angularidades** podcast.
            - Synced latest technical articles from **Medium** (@alejandrocuba).
            - Generated optimized responsive WebP thumbnails.
            - Cleaned up obsolete thumbnail variants.
            - Updated `public/sitemap.xml` `<lastmod>`.
          labels: |
            content
            automated pr
